[project]
name = "ttb-label-verification"
version = "0.1.0"
description = "TTB label verification proof-of-concept"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.117.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.32",
]

[tool.vercel]
# app.py puts backend/ on the import path first; backend.main cannot be imported
# directly from the repository root because its modules import as top-level names.
entrypoint = "app:app"

[tool.vercel.scripts]
# Runs after Python dependencies install and before the function is bundled.
build = "python build.py"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "pytest-asyncio>=1.4.0",
    "uvicorn[standard]>=0.52.3",
    "websocket-client>=1.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["backend", "tools", "tests"]
# backend/ is on sys.path at runtime (pytest pythonpath, sys.path in tools);
# mypy needs telling separately so bare `from comparison import ...` resolves.
mypy_path = "backend"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
# D203/D213: mutually exclusive with D211/D212, which ruff prefers.
# CPY001: no copyright header on a POC.
# COM812/ISC001: conflict with the formatter.
ignore = ["D203", "D213", "CPY001", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, name things descriptively, and hold no docstrings per function.
# FBT003: the warning attestation genuinely is a positional bool.
# RUF001: curly quotes are the input under test, not a typo.
# ARG001/ARG002: test doubles must match a signature they do not fully use.
# D102/D107: fake classes are self-evident; the module docstring covers them.
"tests/**" = [
    "S101", "D103", "PLR2004", "INP001", "FBT003", "RUF001", "ANN202",
    "ARG001", "ARG002", "D102", "D107",
]
# Dev and build scripts print to the terminal by design; that output is how a
# hand-run tool and a deploy log report progress.
"tools/**" = ["T201", "INP001"]
"build.py" = ["T201", "INP001"]
# Module self-checks assert deliberately; they are the runnable check for logic
# that has no separate test module.
# backend/ is a sys.path root, not a package: an __init__.py there collides with
# mypy_path, so INP001 does not apply to modules sitting directly in it.
"backend/main.py" = ["INP001"]
"backend/constants.py" = ["INP001", "S101", "T201"]
# Repository self-check asserts deliberately and prints its result.
"backend/repositories/**" = ["S101", "T201"]
