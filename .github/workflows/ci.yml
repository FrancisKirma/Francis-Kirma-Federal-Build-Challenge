name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The frontend is its own npm project; nothing at the repo root is Node.
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # USWDS fonts and images are generated from node_modules, not committed.
      - run: npm run assets
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npx vite build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact release: setup-uv publishes floating major tags only
      # up to v7, so v10 does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
      - run: uv sync --all-extras
      - run: uv run mypy .
      - run: uv run ruff check .
      - run: uv run pytest
